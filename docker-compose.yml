services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stroke
      POSTGRES_PASSWORD: stroke
      POSTGRES_DB: stroke
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroke"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: ./backend
    command: >
      sh -c "uv run yoyo apply --batch --database \"$$DATABASE_URL\" ./migrations &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://stroke:stroke@postgres:5432/stroke
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: http://localhost:8000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./backend:/app"]

  worker:
    build: ./backend
    command: uv run arq app.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql://stroke:stroke@postgres:5432/stroke
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ["./backend:/app"]

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [api]

volumes:
  pgdata:
